[project]
# The kernel name Zed selects comes from this field: tools/install_kernel.py
# reads it, and .zed/settings.json repeats it under
# jupyter.kernel_selections.python. Rename the project and you must update the
# setting there too — or Zed offers "no kernel" for every notebook.
name = "my-project"
version = "0.1.0"
description = "Jupyter notebooks + Zed, powered by a uv-managed virtualenv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_project"]

[dependency-groups]
# uv installs the `dev` group on a plain `uv sync`, which is what the dev shell
# runs. `ipykernel` is the one Zed actually needs — it discovers notebooks'
# kernels through `jupyter kernelspec list`, and an unregistered kernel means
# every cell offers "no kernel". `jupyterlab` is only for the browser UI.
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
