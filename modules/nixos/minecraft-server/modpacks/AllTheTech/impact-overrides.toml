# impact-overrides.toml — manual impact scores for items whose real gameplay
# significance isn't captured by recipe centrality or item components.
#
# Easy agent append mechanism: if an item's real impact isn't captured by recipe
# centrality or components (e.g. a quest item, a key/lore item, something with
# narrative significance a mod doesn't encode mechanically), append one line
# here with the item ID, a 0-7 impact score, and a short reason — no code
# changes needed. The computed impact_score is ALWAYS still shown alongside the
# override in item-tier output for transparency.
#
# Format: item_id = score   (# optional inline reason)
#
# Bulk import from RarityCore curated tiers (allthetech_tiers.json).
# [raritycore-import] tagged entries are machine-generated — if the source
# config changes, re-run the import rather than hand-editing these lines.
#
