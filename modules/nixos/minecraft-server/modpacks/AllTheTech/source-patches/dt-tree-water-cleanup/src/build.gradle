plugins {
    id 'net.neoforged.moddev' version '2.0.72'
}

version = '1.0.0'
group = 'dev.seanc'
base { archivesName = 'dt-tree-water-cleanup' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = '21.1.238'

    mods {
        dt_tree_water_cleanup {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Mixin annotations only — NeoForge bundles the Mixin library at runtime,
    // and its runtime classes are Mojmap-named, so no refmap is required.
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

tasks.named('jar', Jar) {
    manifest.attributes['MixinConfigs'] = 'dt_tree_water_cleanup.mixins.json'
    archiveClassifier = ''
}