#Enable curses. When disabled, rituals that apply curses will not function.
enableCurses = true
#Require Ghost of the Light infusion to use mirror teleportation. When enabled, only players with this infusion can teleport through mirrors.
requireGhostOfLightInfusion = false
#Enable player werewolves to spread lycanthropy at level 10.
enableLycanthropy = true
#Maximum number of blocks in a vein to mine with Hag's ring.
maxVinSize = 81
#Whether Hunters can ambush vampires, werewolves, and liches
hunterAmbushEnabled = true
#Enable aero-like category banners in the Witchery creative tab. When disabled, items are shown as a flat grid without banner headers or spacer slots.
enableCreativeTabBanners = true
#Whether empowered Sunstone Pendants provide permanent sunlight protection to vampires while worn.
enableEmpoweredSunstonePendantProtection = true
#Whether empowered Mooncharm Pendants provide the Blood Scent ability while worn.
enableEmpoweredMooncharmPendantAbility = true
