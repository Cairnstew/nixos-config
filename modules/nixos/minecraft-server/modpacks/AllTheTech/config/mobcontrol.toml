# ===============================================================
# Mob Control — AllTheTech tiered, THEMEd structure placement
# ===============================================================
# GENERATED from config/allthetech/mob_tiers.json (keep both in sync).
# Categories are sorted by tier desc (harder first, first-match-wins).
# Each tiered mob gets:
#   1. natural rule allowed inside its category's structures (+
#      structure-only scaling from the category tier),
#   2. natural wild rule (structure=none) so it still appears outside
#      generated structures (vanilla-like behavior).
# Mobs in multiple categories get one [[mob]] block per category; the
# first block whose structure rule matches wins, so cross-theme mobs
# (e.g. beheaded_knight in graveyard AND pirate) resolve correctly.
# Unmatched spawns fall through to the pack catch-all at the bottom.
#
# NOTE: structure= matches by EXACT structure id ('<ns>:<id>' or full
# path like 'trek:monster_room/lower/default') or '<ns>:*' wildcard —
# set names are NOT valid here. Verified against the pinned jars.
# ===============================================================

[general]
debug=false
use-generation-check=false

