name: Merge Per-Host Branch

on:
  push:
    branches: [desktop, laptop, server, wsl, minimal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Validate config
        run: |
          nix build ".#nixosConfigurations.${{ github.ref_name }}.config.system.build.toplevel" --dry-run 2>&1 | tail -1

      - name: Merge to master
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          # Fetch latest master
          git fetch origin master

          # Check if already up-to-date
          if git merge-base --is-ancestor "origin/$BRANCH" origin/master; then
            echo "::notice::$BRANCH is already merged into master — nothing to do"
            exit 0
          fi

          # Checkout master and merge
          git checkout master
          git merge "origin/$BRANCH" --no-edit -m "Merge $BRANCH into master (auto)"

          # Push
          git push origin master
          echo "Merged $BRANCH → master"
